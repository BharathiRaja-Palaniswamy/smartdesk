<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pebble Spa (demo site)</title>
<!-- A stand-in for a business's own website, with its own styles, to show the
     SmartDesk widget dropped in with one line and not clashing with them. -->
<style>
  body { margin: 0; font-family: Georgia, serif; background: #f3efe7; color: #2d2a26; }
  header { padding: 64px 24px; text-align: center; background: #dfe8e1; }
  h1 { font-size: 44px; margin: 0 0 8px; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 24px 120px; font-size: 18px; line-height: 1.6; }
  button { background: red; }   /* a careless site rule the widget must ignore */
  .demo { font-family: Arial, sans-serif; font-size: 13px; background: #fff3cd; padding: 8px 12px; border-radius: 6px; }
</style>
</head>
<body>
<header>
  <h1>Pebble Spa</h1>
  <p>Massages, facials and quiet time.</p>
</header>
<main>
  <p class="demo">Demo page: a business's own website with the SmartDesk chat added. Open the chat at the bottom right.</p>
  <h2>Our treatments</h2>
  <p>Swedish and deep tissue massage, signature facials, manicures and pedicures.</p>
  <h2>Visit us</h2>
  <p>Open Monday to Saturday, 9 am to 7 pm.</p>
</main>

<!-- The one line a business pastes, from the last step of onboarding: -->
<script src="../widget/chat.js" data-business="pub_demo_pebble" defer></script>
</body>
</html>
